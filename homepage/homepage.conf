# Homepage-Konfiguration
# Wird von homepage.service als EnvironmentFile eingebunden (/etc/conf.d/homepage)

# Port, auf dem der eingebaute Next.js-Server lauscht
PORT=3000

# Wo homepage seine YAML-Konfigurationsdateien erwartet/anlegt
# (beim ersten Start werden hier automatisch Beispieldateien angelegt)
HOMEPAGE_CONFIG_DIR=/etc/homepage

# Zusaetzlich erlaubte Host:Port-Kombinationen fuer den eingebauten
# Host-Header-Check (localhost/127.0.0.1/[::1] mit obigem PORT sind
# immer erlaubt). Bei Zugriff ueber Reverse-Proxy oder eigene Domain
# hier ergaenzen, kommagetrennt (z. B. "homepage.example.com:443"),
# oder "*" zum vollstaendigen Abschalten der Pruefung.
#HOMEPAGE_ALLOWED_HOSTS=homepage.example.com
