name: Update packages.json

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate packages.json
        run: python3 build_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet packages.json; then
            echo "Keine Änderungen in packages.json."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add packages.json
          git commit -m "chore: packages.json aktualisiert [skip ci]"
          git push
